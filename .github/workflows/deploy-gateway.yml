name: Deploy API Gateway

on:
  push:
    branches:
      - main
    paths:
      - 'api-gateway/**' #solo se ejecuta si hay cambios aqui
      - '.github/workflows/deploy-gateway.yml' #tambien si modificamos este archivo

env:
  PROJECT_ID: feriando-499722
  REGION: southamerica-west1
  REPO_NAME: microservicios-feriando

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v3

      - name: Configurar Java 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configurar Docker en la nube
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Compilar API Gateway
        run: mvn clean package -DskipTests
        working-directory: ./api-gateway

      - name: Construir y Subir Imagen Docker
        run: |
          docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/api-gateway:${{ github.sha }} .
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/api-gateway:${{ github.sha }}
        working-directory: ./api-gateway

      - name: Desplegar en Cloud Run
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: api-gateway
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/api-gateway:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |-
            PORT=8080