spring.application.name=ms-pago
server.port=8088

spring.datasource.url=jdbc:postgresql://localhost:5432/feriando_db?currentSchema=pago_schema
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=pago_schema
spring.jpa.show-sql=false

# URLs de microservicios consumidos al confirmar un pago
feriando.ms-pedido.url=http://localhost:8086
feriando.ms-inventario.url=http://localhost:8084

logging.level.cl.feriando=INFO
