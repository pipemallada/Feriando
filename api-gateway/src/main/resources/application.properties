spring.application.name=api-gateway
server.port=8080

# Cada ruta del gateway redirige al microservicio correspondiente.
# Formato: /api/<recurso>/** -> http://localhost:<puerto-del-ms>/<recurso>/**

spring.cloud.gateway.routes[0].id=ms-usuario
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/usuarios/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=ms-feriante
spring.cloud.gateway.routes[1].uri=http://localhost:8082
